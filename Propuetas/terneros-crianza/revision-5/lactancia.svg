<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64" role="img" aria-labelledby="titulo">
  <title id="titulo">Ternero mamando</title>
  <desc>El ternero estira el cuello, levanta el hocico y prende un pezón de la ubre.</desc>
  <g stroke="#574039" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    <!-- Anca, vientre y corvejón de la madre vistos de lado. -->
    <path d="M5 6Q20 3 39 7l4 6c-2 5-7 9-14 11l-9 1q-4 4-6 11l-2 9-1 10H5l1-13 2-9c1-6-2-11-3-15Q3 11 5 6Z" fill="#B96C4F"/>
    <path d="M5.7 7.5q8-2.2 13 .7c4.5 2.9 4.1 6.8 10.2 7 4.4.2 7.3-1.8 10-1-3 4.1-8.2 6.9-13.8 7.6l-6.7 1.8c-3.1-1-3.5-5.5-6.7-7.6-2.1-1.5-4.2-1.3-6.3-1.9Z" fill="#FBF1E6" stroke="none"/>
    <path d="M4.7 9q-2 7.3-1 14" fill="none"/>
    <!-- El pezón libre deja visible la forma de la ubre; el otro entra en la boca. -->
    <path d="M18 23.3c5.1-.2 9.2-1 14.4-3.1 1.8 4.1-.8 9.5-5.3 11l-.3 4.8q-1.3 2-3 .3l-.5-4.7-2.6-.2-1.2 4q-1.9 1.6-3-.6l.8-4.8q-2.1-3.1.7-6.7Z" fill="#E6A5A0"/>
    <!-- El cuello y el lomo comparten silueta. Las patas delanteras sostienen el empuje. -->
    <path d="M56 42q5.4-1 5.1-6.3" fill="none" stroke-width="2"/>
    <path d="M32 35q3.5 1.4 7.5 4.5c4.5 2.3 10.7 1.7 16.1 1.2 4.1-.4 6.3 3.3 5.6 7l-2 5 .6 6.5h-4.3l-1.5-7.6-2-2q-4.8 1.6-10.3-.1l-4.2 10h-4.3l2.7-13q-4.2-2.8-8.1-7.8Z" fill="#DE9477"/>
    <path d="M46.4 42.2q5.3.7 9.1-.1 2.1 2.2 1.1 5.3-3.2.7-5.4-1.3-2.4-2.2-4.8-2Z" fill="#FBF1E6" stroke="none"/>
    <path d="M23.1 34.3c1.1-2.1 3.4-2.2 5.4-1.2 1.8.9 4.1.9 6.2 1.8 3.3 1.5 4.9 5.6 2.3 8.5-1.8 1.9-5.2 1.8-7.6-.2l-4.6-4.6c-1.7-1.2-2.3-2.9-1.7-4.3Z" fill="#FBF1E6"/>
    <path d="M34.4 37.3c2.8-2.9 6.4-3.1 9.8-1.8-.7 4.2-4.8 6.8-9.1 6.1Z" fill="#DE9477"/>
    <path d="M22.1 34.4q1.4-2.4 3.6-2.1l2.6 2.4-2.7 3q-2.1.4-3.4-1.4Z" fill="#E6A5A0" stroke-width="1.3"/>
  </g>
  <path d="M23.8 34.4q1.2 1.4 2.6 1.1" fill="none" stroke="#574039" stroke-width="1.25" stroke-linecap="round"/>
