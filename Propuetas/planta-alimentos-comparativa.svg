<svg x="554" y="144" width="192" height="192" viewBox="0 0 64 64"><title id="titulo">Planta industrial de alimentos</title>
  <desc id="descripcion">Dos silos cilíndricos conectados a una torre de proceso alta y una nave industrial baja. Colores planos del kit, sin humo ni chimeneas.</desc>
  <!-- Pasarela que conecta los silos con la torre. -->
  <path d="M12 18h15l10-8 2 3-11 9H12Z" fill="#24465B"/>
  <!-- Dos silos: tapas curvas y una cara lateral que sugiere volumen. -->
  <path d="M4 22h13v29c0 2-13 2-13 0Z" fill="#B0BEC5"/>
  <path d="M13 22h4v29c0 1-2 1.5-4 1.5Z" fill="#8A949E"/>
  <ellipse cx="10.5" cy="22" rx="6.5" ry="3" fill="#E2F2F5"/>
  <path d="M19 19h13v32c0 2-13 2-13 0Z" fill="#B0BEC5"/>
  <path d="M28 19h4v32c0 1-2 1.5-4 1.5Z" fill="#8A949E"/>
  <ellipse cx="25.5" cy="19" rx="6.5" ry="3" fill="#E2F2F5"/>
  <!-- Torre de proceso: estructura alta con tres niveles visibles. -->
  <rect x="36" y="6" width="14" height="46" rx="1" fill="#378CE7"/>
  <path d="M46 6h4v46h-4Z" fill="#24465B"/>
  <path d="M34 5h18v4H34Z" fill="#24465B"/>
  <path d="M40 14h4v5h-4Zm0 9h4v5h-4Zm0 9h4v5h-4Z" fill="#F3AD43"/>
  <!-- Nave de producción en primer plano. -->
  <path d="M25 43h35v15H25Z" fill="#378CE7"/>
  <path d="M25 43h35v4H25Z" fill="#24465B"/>
  <path d="m23 43 10-7h20l9 7Z" fill="#24465B"/>
  <path d="M31 49h8v4h-8Zm12 0h11v9H43Z" fill="#E2F2F5"/>
  <path d="M48 49h2v9h-2Z" fill="#24465B"/>
  <rect x="3" y="57" width="58" height="3" rx="1.5" fill="#24465B"/></svg>
