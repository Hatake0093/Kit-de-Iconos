<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tractor con mixer de alimento remolcado</title>
  <desc id="desc">Tractor azul orientado hacia la izquierda, acoplado a una mezcladora roja de tolva alta y abierta, con borde oscuro, escalera amarilla y rueda grande.</desc>
  <!-- Bastidor y enganche del remolque. -->
  <path d="M25 44h35" fill="none" stroke="#24465B" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 42h27v4H32Z" fill="#B94A58"/>
  <!-- Tolva ancha arriba, estrecha en la base, como en la referencia. -->
  <path d="M30 16h32l-4 23c-.5 3-3 4-6 4H40c-3 0-5-1-6-4Z" fill="#E56876"/>
  <path d="M55 19h7l-4 20c-.5 3-3 4-6 4h-2c4-6 5-15 5-24Z" fill="#B94A58"/>
  <ellipse cx="46" cy="16" rx="16" ry="5" fill="#24465B"/>
  <ellipse cx="46" cy="15.5" rx="13" ry="2.8" fill="#B94A58"/>
  <!-- Pequeño sinfín visible dentro de la boca de la tolva. -->
  <path d="m45 13-3 4h8l-3-4Z" fill="#E2F2F5"/>
  <path d="M46 12.5v4" stroke="#24465B" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Escalera y compuerta de servicio. -->
  <path d="M31 26v16m4-16v16m-4-13h4m-4 5h4m-4 5h4" fill="none" stroke="#F3AD43" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M39 29h5v10h-5Z" fill="#B94A58"/>
  <path d="M40 31v5" stroke="#F3AD43" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40 45v-3c0-2 2-3 4-3h10c2 0 3 1 4 3l1 3Z" fill="#B94A58"/>
  <!-- Cabina y motor del tractor. -->
  <path d="M7 28v8" stroke="#24465B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M14 25h12l2 18H12Z" fill="#378CE7"/>
  <path d="M16 27h8l1 10H15Z" fill="#E2F2F5"/>
  <path d="M20 27v10" stroke="#24465B" stroke-width="1.5"/>
  <rect x="12" y="22" width="16" height="4" rx="1.5" fill="#24465B"/>
  <path d="M5 35h11v10H3v-7c0-2 1-3 2-3Z" fill="#378CE7"/>
  <rect x="3" y="38" width="4" height="6" rx="1" fill="#24465B"/>
  <path d="M2 45h28" stroke="#24465B" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 41c2-7 14-7 16 0" fill="none" stroke="#378CE7" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Ruedas: trasera del tractor mayor que la delantera. -->
  <circle cx="7" cy="49" r="5" fill="#24465B"/>
  <circle cx="7" cy="49" r="2" fill="#E2F2F5"/>
  <circle cx="22" cy="47" r="8" fill="#24465B"/>
  <circle cx="22" cy="47" r="3.5" fill="#E2F2F5"/>
  <circle cx="22" cy="47" r="1.3" fill="#8A949E"/>
  <circle cx="49" cy="48" r="7" fill="#24465B"/>
  <circle cx="49" cy="48" r="3" fill="#E2F2F5"/>
  <circle cx="49" cy="48" r="1.1" fill="#8A949E"/>
</svg>
