<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Hélice de ADN</title>
  <desc id="desc">Doble hélice con dos cadenas entrelazadas y pares de bases.</desc>
  <!-- Pares de bases -->
  <g stroke="#24465B" stroke-width="3.5" stroke-linecap="round">
    <path d="M19 8 45 8"/><path d="M13 16 51 16"/>
    <path d="M12 24 52 24"/><path d="M17 32 47 32"/>
    <path d="M12 40 52 40"/><path d="M13 48 51 48"/>
    <path d="M19 56 45 56"/>
  </g>
  <!-- Cadenas de la doble hélice -->
  <path d="M19 7 C19 17 45 17 45 24 C45 32 19 32 19 40 C19 48 45 48 45 57"
        fill="none" stroke="#378CE7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M45 7 C45 17 19 17 19 24 C19 32 45 32 45 40 C45 48 19 48 19 57"
        fill="none" stroke="#24AC88" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Puntos de unión -->
  <g fill="#E2F2F5">
    <circle cx="19" cy="8" r="1.2"/><circle cx="45" cy="8" r="1.2"/>
    <circle cx="13" cy="16" r="1.2"/><circle cx="51" cy="16" r="1.2"/>
    <circle cx="12" cy="24" r="1.2"/><circle cx="52" cy="24" r="1.2"/>
    <circle cx="17" cy="32" r="1.2"/><circle cx="47" cy="32" r="1.2"/>
    <circle cx="12" cy="40" r="1.2"/><circle cx="52" cy="40" r="1.2"/>
    <circle cx="13" cy="48" r="1.2"/><circle cx="51" cy="48" r="1.2"/>
    <circle cx="19" cy="56" r="1.2"/><circle cx="45" cy="56" r="1.2"/>
  </g>
</svg>
